<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abrusu Sampson Junior | Digital Resume</title>
    <meta
      name="description"
      content="Digital resume of Abrusu Sampson Junior, frontend developer."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!--
      Dark-mode-before-paint. Kept as a raw inline script (not ported to React):
      it must run and set the class on <html> before the bundle loads, or the
      page flashes the wrong theme. React reads this already-applied state on
      mount instead of re-deciding it.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('asj-theme');
        var dark = stored ? stored === 'dark' : true;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body
    class="bg-paper text-[#1c1c1c] dark:bg-ink dark:text-[#ececec] font-body antialiased transition-colors duration-300"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
